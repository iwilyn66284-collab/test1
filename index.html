
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBid Pro | 智能投标书专家级编制系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --font-primary: 'Noto Sans SC', "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body { 
            font-family: var(--font-primary);
            background-color: #F8FAFC;
            -webkit-font-smoothing: antialiased;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        
        /* 核心：PDF 导出容器样式加固，防止乱码 */
        .pdf-export-container {
            font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif !important;
            color: #000 !important;
        }
        
        /* 强制 textarea 自动换行且高度自适应外观 */
        .bid-editor {
            line-height: 1.8;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
<script type="importmap">

</head>
